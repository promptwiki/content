name: 번역 요청 (Translation)
description: 특정 문서의 번역이 필요할 때
labels: ["translation"]
body:
  - type: input
    id: doc
    attributes:
      label: 번역 대상 문서 경로
      placeholder: "예: ko/guide/beginner/how-to-give-context.md"
    validations:
      required: true
  - type: dropdown
    id: target-lang
    attributes:
      label: 번역 목표 언어
      options: [en, ko]
    validations:
      required: true
