name: 문서 요청 (Doc Request)
description: 새로운 문서가 필요할 때 요청하세요
labels: ["doc-request"]
body:
  - type: markdown
    attributes:
      value: "필요한 문서를 요청해주세요. 직접 작성하실 수 있다면 PR을 바로 올리셔도 됩니다."
  - type: input
    id: title
    attributes:
      label: 원하는 문서 제목
      placeholder: "예: AI에게 표 형식으로 출력 요청하는 방법"
    validations:
      required: true
  - type: dropdown
    id: purpose
    attributes:
      label: 문서 유형
      options: [guide, rule, template, example, reference]
    validations:
      required: true
  - type: dropdown
    id: level
    attributes:
      label: 난이도
      options: [beginner, intermediate, advanced]
    validations:
      required: true
  - type: textarea
    id: reason
    attributes:
      label: 왜 필요한가요?
      placeholder: "이 문서가 왜 필요한지, 어떤 상황에서 도움이 될지 설명해주세요."
    validations:
      required: true
